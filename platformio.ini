; BSHMIEinkDevice firmware. See doc/PROTOCOL.md at the repository root for the wire protocol this
; firmware implements, and its §22 "Implementation status" for current build/hardware verification
; status.

[platformio]
default_envs = esp32-s3-crowpanel

; This env is CrowPanel-specific (hence the name) - a different board gets its own [env:...]
; below with its own -DBOARD_* flag selecting its firmware/include/boards/board_*.h hardware
; definition (see BoardConfig.h and boards/board_template.h).
;
; Board id points at boards/crowpanel_4_2.json, a real custom PlatformIO board profile (not to be
; confused with firmware/include/boards/board_crowpanel_4_2.h, this project's own display/pin
; definition - a different thing with a similar name; PlatformIO board JSONs don't encode GPIO
; wiring, only MCU/flash/PSRAM/upload metadata, so this didn't actually need to wait for the pin
; mapping to be probed on the physical board, unlike that header does). It replaces the earlier
; generic "esp32-s3-devkitc-1" stand-in, which was both inaccurate (its own name says "No PSRAM",
; the opposite of this module) and needed several per-project overrides below just to behave
; correctly on this hardware - all now folded into the board profile itself: memory_type=qio_opi
; (the CrowPanel's ESP32-S3-WROOM-1-N8R8 module wires its 8 MB PSRAM over Octal SPI, with 8 MB
; flash still on Quad SPI - the devkitc-1 profile's own default of no PSRAM produced a real
; "PSRAM ID read error" on first boot on real hardware before this was set; confirmed still
; correct after moving it here), upload.speed=115200 (CH340 USB-serial adapters, as used on this
; board, are prone to dropouts at esptool's default higher speed - two failed uploads at the
; default rate, "Invalid head of packet"/"chip stopped responding", is what led to this originally),
; and upload.flash_size/maximum_size (8MB).
[env:esp32-s3-crowpanel]
platform = espressif32
board = crowpanel_4_2
; default_8MB.csv is a scheme built into the Arduino-ESP32 core: two ~3.1875 MB OTA app slots
; (ota_0/ota_1) + a ~1.5625 MB data partition for internal storage (doc/PROTOCOL.md §14 VOLUME
; INTERNAL), needed for OTA updates (§16) to work at all - the board's other default partition
; tables only have a single non-OTA app slot. (Also already the board profile's own
; build.arduino.partitions default - repeated here as an explicit override so it stays correct
; even if the board profile's own default ever changes for an unrelated reason.)
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
framework = arduino
lib_deps =
	h2zero/NimBLE-Arduino@2.5.1
	; SSD1683 e-paper driver (next-steps.md #3) - GxEPD2's GDEY042T81 panel class matches this
	; board's display exactly (400x300, SSD1683); Adafruit GFX/BusIO are its own declared deps,
	; pinned explicitly here for reproducibility rather than left to auto-resolution.
	zinggjm/GxEPD2@1.6.9
	adafruit/Adafruit GFX Library@1.12.6
	adafruit/Adafruit BusIO@1.17.4
	; DRAW_TEXT FONT_ID 0x01 (§12.6): bridges u8g2's own font ROM data onto WorkingBufferGfx (any
	; Adafruit_GFX-derived object), used for u8g2_font_unifont_t_extended - a real precomposed-glyph
	; font covering Latin Extended-A (Czech diacritics), unlike FreeMono12pt7b's hand-composed
	; diacritic-overlay approach it replaces.
	olikraus/U8g2_for_Adafruit_GFX@1.8.0
monitor_speed = 115200
build_flags =
	-DBOARD_CROWPANEL_4_2
	-std=gnu++17
build_unflags =
	-std=gnu++11

; Host-native build for the transport-independent protocol logic (Crc16, RlePackBits, Frame) -
; no ESP32 toolchain required. `pio test -e native`
[env:native]
platform = native
test_framework = unity
build_flags =
	-std=c++17
