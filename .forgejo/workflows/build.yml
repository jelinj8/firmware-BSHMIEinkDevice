# Builds and publishes firmware binaries for every PlatformIO device env on a version-tag push
# (vMAJOR.MINOR.PATCH). Publishes each as a Forgejo generic package to this repo's own package
# registry. Replaces the earlier `runs-on: platformio` stub, which targeted a runner
# label/image that never existed in this infrastructure - use the proven `embedded` label
# instead (see devenv/firmware-sample's own build.yml, which validated it end to end).
#
# This file lives on GitHub (the real source of truth, which Forgejo pull-mirrors) rather than
# being pushed directly to the Forgejo side - a commit made only on the Forgejo side of a pull
# mirror would very likely be silently discarded on the next sync from GitHub.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  build:
    runs-on: embedded
    # Pins PlatformIO's package/download cache to the runner's shared pio-cache volume (see
    # K8s_Talos/talos-minipc/k8s_forgejo/04-runner-config-configmap.yaml). Without this, every job
    # re-downloads from scratch - confirmed 2026-09-14 against this exact repo/board
    # (esp32-s3-crowpanel pulled toolchain-xtensa-esp32s3/toolchain-riscv32-esp plus all of
    # NimBLE-Arduino/GxEPD2/Adafruit GFX/etc. on every run), since a job runs in a fresh container
    # from the immutable base image and nothing baked into sys/runner-embedded covers this board
    # or this project's lib_deps.
    #
    # MUST be /root/.platformio specifically, not an arbitrary path (first attempt used
    # /tmp/pio-core and broke this exact build 2026-09-14/15: esptool.py failed with
    # "ModuleNotFoundError: No module named 'intelhex'", because that's where the Dockerfile's own
    # `pio pkg install` built PlatformIO's managed Python venv at image-build time - pointing
    # PLATFORMIO_CORE_DIR anywhere else discards that venv along with everything else baked in).
    env:
      PLATFORMIO_CORE_DIR: /root/.platformio
    strategy:
      matrix:
        # One entry per [env:...] block in platformio.ini that's a real device target (not the
        # host-side `native` test env). Add a future device by adding its [env:...] block to
        # platformio.ini and a matching entry here, e.g.:
        #   env: [esp32-s3-crowpanel, esp32-s3-companiondevice]
        env: [esp32-s3-crowpanel]
    steps:
      - name: Clone repository at tag
        run: |
          git clone --depth 1 --branch "${{ github.ref_name }}" \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@${{ vars.REGISTRY_URL }}/${{ github.repository }}.git" src

      - name: Stamp release version into kFirmwareVersion (workflow-local patch, not committed)
        working-directory: src
        run: |
          TAG="${{ github.ref_name }}"
          # kFirmwareVersion's RHS is several adjacent string literals concatenated with the
          # __DATE__/__TIME__ macros (e.g. "0.1.0-dev (" __DATE__ " " __TIME__ ")"), not one
          # simple "literal"; - match everything between "= " and the trailing ";" wholesale
          # rather than assuming a single quoted string, or this silently fails to match at all.
          sed -i -E 's/^(constexpr char kFirmwareVersion\[\] = ).*;$/\1"'"${TAG}"' (" __DATE__ " " __TIME__ ")";/' src/main.cpp
          grep -n 'kFirmwareVersion\[\]' src/main.cpp

      - name: Build firmware
        working-directory: src
        run: pio run -e ${{ matrix.env }}

      - name: Package build outputs
        working-directory: src
        run: |
          TAG="${{ github.ref_name }}"
          ENV="${{ matrix.env }}"
          BIN_NAME="bshmieink-${ENV}-${TAG}.bin"
          ELF_NAME="bshmieink-${ENV}-${TAG}.elf"
          cp ".pio/build/${ENV}/firmware.bin" "${BIN_NAME}"
          cp ".pio/build/${ENV}/firmware.elf" "${ELF_NAME}"
          echo "BIN_NAME=${BIN_NAME}" >> "$GITHUB_ENV"
          echo "ELF_NAME=${ELF_NAME}" >> "$GITHUB_ENV"
          echo "PKG_NAME=bshmieink-${ENV}" >> "$GITHUB_ENV"

      - name: Publish firmware binary + elf as a generic package
        working-directory: src
        run: |
          TAG="${{ github.ref_name }}"
          for FILE in "${BIN_NAME}" "${ELF_NAME}"; do
            curl -sf -u "bot:${{ secrets.ORG_PACKAGES_TOKEN }}" \
              --upload-file "${FILE}" \
              "https://${{ vars.REGISTRY_URL }}/api/packages/${{ github.repository_owner }}/generic/${PKG_NAME}/${TAG}/${FILE}"
          done

      - name: Link package to this repo (best-effort, cosmetic only)
        run: |
          OWNER=$(echo "${{ github.repository }}" | cut -d/ -f1)
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d/ -f2)
          curl -s -w 'link status=%{http_code}\n' -u "bot:${{ secrets.ORG_PACKAGES_TOKEN }}" -X POST \
            "https://${{ vars.REGISTRY_URL }}/api/v1/packages/$OWNER/generic/${PKG_NAME}/-/link/$REPO_NAME"
